<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPO法人みどり川ネット 清掃ボランティア募集</title>
  <style>
    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      color: #173b2f;
      background: #e7f4ea;
      line-height: 1.7;
    }
    header {
      background: #1f7a4d;
      color: white;
      padding: 36px 9vw;
      clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
    }
    main {
      max-width: 900px;
      margin: 28px auto 48px;
      padding: 0 20px;
    }
    .panel {
      background: white;
      border-radius: 4px;
      padding: 24px;
      margin-bottom: 18px;
      border-left: 8px solid #72b65a;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
    }
    h2 {
      margin-top: 0;
    }
    ul {
      padding-left: 1.2em;
    }
  </style>
</head>
<body>
  <header>
    <h1>NPO法人みどり川ネット</h1>
    <p>川辺の清掃、外来植物の観察、親子向け自然学習会を行う市民団体です。</p>
  </header>
  <main>
    <section class="panel">
      <h2>春の清掃ボランティア</h2>
      <p>みどり川沿いの遊歩道で、ごみ拾いと水辺の生き物観察を行います。参加者には軍手と記録カードを配布します。</p>
      <ul>
        <li>集合: みどり橋西側広場</li>
        <li>時間: 9時30分から11時30分</li>
        <li>持ち物: 帽子、飲み物、歩きやすい靴</li>
      </ul>
    </section>
    <section class="panel">
      <h2>ページ情報</h2>
      <p><strong>対象者:</strong> 地域住民、親子、環境保全に関心のある学生</p>
      <p><strong>製作者:</strong> NPO法人みどり川ネット 広報班</p>
      <p><strong>更新情報:</strong> 2026年4月20日、集合場所を更新</p>
    </section>
  </main>
</body>
</html>
