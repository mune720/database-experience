<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひなたベーカリー 季節のパン</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #fff3e1;
      color: #4a2f21;
      line-height: 1.7;
    }
    header {
      background: #f6a94f;
      color: #3b2418;
      padding: 34px 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.3rem);
    }
    main {
      max-width: 960px;
      margin: 28px auto 50px;
      padding: 0 20px;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }
    .item {
      background: white;
      border: 2px dashed #b66d2f;
      border-radius: 6px;
      padding: 18px;
    }
    .info {
      margin-top: 20px;
      background: #4a2f21;
      color: #fff7ec;
      padding: 20px;
      border-radius: 6px;
    }
    h2, h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>ひなたベーカリー</h1>
    <p>駅前商店街の小さなパン屋です。朝焼きの食パンと季節の総菜パンを作っています。</p>
  </header>
  <main>
    <section class="menu">
      <article class="item">
        <h2>新玉ねぎのフォカッチャ</h2>
        <p>地元農家の新玉ねぎを使った、春だけの惣菜パンです。</p>
      </article>
      <article class="item">
        <h2>図書館前ブレンド</h2>
        <p>近くの図書館帰りに飲みやすい、軽めのコーヒーも販売しています。</p>
      </article>
      <article class="item">
        <h2>子どもパン教室</h2>
        <p>月に一度、商店街会館で親子向けのパン作り体験を開きます。</p>
      </article>
    </section>
    <section class="info">
      <h2>ページ情報</h2>
      <p><strong>対象者:</strong> 近隣住民、通勤通学の利用者、親子イベントを探す人</p>
      <p><strong>製作者:</strong> ひなたベーカリー店主 佐伯陽子</p>
      <p><strong>更新情報:</strong> 2026年5月8日、季節商品を入れ替え</p>
    </section>
  </main>
</body>
</html>
