<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ウェルネス睡眠クリニック 睡眠相談のご案内</title>
  <style>
    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f2f8f7;
      color: #243b3a;
      line-height: 1.75;
    }
    header {
      padding: 42px 8vw;
      background: #d8efee;
      border-bottom: 1px solid #a6ccca;
    }
    header p {
      max-width: 680px;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 50px;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(220px, .8fr);
      gap: 22px;
    }
    section {
      background: white;
      border-radius: 6px;
      padding: 22px;
      border: 1px solid #d3e4e3;
    }
    h1 {
      color: #176d69;
      margin: 0 0 10px;
    }
    h2 {
      margin-top: 0;
      color: #176d69;
    }
    @media (max-width: 720px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ウェルネス睡眠クリニック</h1>
    <p>寝つきにくさ、夜中に目が覚める、日中の眠気などについて、医師と臨床心理士が相談を受ける地域クリニックです。</p>
  </header>
  <main>
    <section>
      <h2>睡眠相談の内容</h2>
      <p>初回は生活リズム、服薬状況、仕事や学習の負担を確認します。必要に応じて睡眠日誌を使い、生活改善と医学的検査のどちらが必要かを一緒に考えます。</p>
      <p>このページは受診前の案内であり、緊急の症状がある場合は救急窓口へ相談してください。</p>
    </section>
    <section>
      <h2>ページ情報</h2>
      <p><strong>対象者:</strong> 睡眠の悩みがある成人、受験生の保護者、産業保健担当者</p>
      <p><strong>製作者:</strong> ウェルネス睡眠クリニック 広報担当</p>
      <p><strong>更新情報:</strong> 2026年2月28日、相談時間を更新</p>
    </section>
  </main>
</body>
</html>
