<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星丘ナイトマーケット2026 開催案内</title>
  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Yu Gothic", sans-serif;
      color: #fffaf0;
      background: #241232;
      line-height: 1.7;
    }
    header {
      min-height: 300px;
      display: grid;
      align-items: center;
      padding: 38px 8vw;
      background:
        radial-gradient(circle at 20% 25%, #ffd166 0 3px, transparent 4px),
        radial-gradient(circle at 80% 35%, #06d6a0 0 4px, transparent 5px),
        linear-gradient(140deg, #241232, #7b2cbf 55%, #ef476f);
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 5rem);
      margin: 0;
      letter-spacing: 0;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 20px 56px;
    }
    .columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
    section {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .22);
      padding: 20px;
      border-radius: 6px;
    }
    h2 {
      color: #ffd166;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p>地域商店街と学生スタッフでつくる夏の一夜</p>
      <h1>星丘ナイトマーケット2026</h1>
    </div>
  </header>
  <main>
    <div class="columns">
      <section>
        <h2>開催内容</h2>
        <p>駅前広場に、地元飲食店の屋台、手作り雑貨、学生バンドのステージが並びます。図書館前では古本交換コーナーも行います。</p>
      </section>
      <section>
        <h2>分類のヒント</h2>
        <p>イベント告知ですが、地域商店、文化活動、学生参加、観光案内の要素もあります。分類候補を一つに決めにくいページです。</p>
      </section>
      <section>
        <h2>ページ情報</h2>
        <p><strong>対象者:</strong> 地域住民、商店街利用者、学生、週末の催しを探す人</p>
        <p><strong>製作者:</strong> 星丘商店街振興組合 イベント実行委員会</p>
        <p><strong>更新情報:</strong> 2026年5月12日、出店予定を更新</p>
      </section>
    </div>
  </main>
</body>
</html>
