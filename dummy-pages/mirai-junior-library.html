<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>みらい中学校 図書委員会だより</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: #fff7d6;
      color: #263238;
      line-height: 1.75;
    }
    header {
      background: repeating-linear-gradient(45deg, #4fc3f7, #4fc3f7 18px, #81c784 18px, #81c784 36px);
      padding: 38px 20px;
      text-align: center;
    }
    header div {
      display: inline-block;
      background: white;
      border: 4px solid #263238;
      padding: 20px 28px;
      transform: rotate(-1deg);
    }
    main {
      max-width: 840px;
      margin: 26px auto;
      padding: 0 18px 42px;
    }
    section {
      background: white;
      border: 3px solid #263238;
      box-shadow: 6px 6px 0 #ffca28;
      padding: 20px;
      margin-bottom: 24px;
    }
    h1, h2 {
      margin: 0 0 10px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>みらい中学校 図書委員会だより</h1>
      <p>昼休みの図書室イベントと新着本を紹介します。</p>
    </div>
  </header>
  <main>
    <section>
      <h2>今月の企画</h2>
      <p>5月は「調べる力週間」です。百科事典、新聞記事データベース、地域資料を使って、気になるテーマを小さなポスターにまとめます。</p>
    </section>
    <section>
      <h2>おすすめ本</h2>
      <p>科学実験、スポーツ小説、地域の昔話を新しく入れました。読みたい本が貸出中のときは、カウンターで予約できます。</p>
    </section>
    <section>
      <h2>ページ情報</h2>
      <p><strong>対象者:</strong> みらい中学校の生徒、保護者、学校図書館に関心のある教職員</p>
      <p><strong>製作者:</strong> みらい中学校図書委員会と学校司書</p>
      <p><strong>更新情報:</strong> 2026年5月1日、新着本リストを追加</p>
    </section>
  </main>
</body>
</html>
