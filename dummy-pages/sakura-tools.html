<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サクラツールズ株式会社 小型3Dプリンタ案内</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Yu Gothic", sans-serif;
      color: #222;
      background: #f5f5f5;
    }
    .hero {
      min-height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #202020, #c52f40);
      padding: 36px 18px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      margin: 0 0 12px;
      letter-spacing: 0;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 20px 44px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    article, aside {
      background: white;
      border-radius: 6px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }
    h2 {
      color: #c52f40;
      margin-top: 0;
    }
    .spec {
      font-family: "Courier New", monospace;
      background: #111;
      color: #f7f7f7;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div>
      <h1>Sakura MiniFab 120</h1>
      <p>教室や小規模工房で使いやすい、卓上型3Dプリンタの製品紹介です。</p>
    </div>
  </header>
  <main>
    <div class="grid">
      <article>
        <h2>製品概要</h2>
        <p>Sakura MiniFab 120は、試作品制作とSTEAM教材向けに設計された小型3Dプリンタです。自動水平補正と密閉カバーにより、初学者でも安定した出力を目指せます。</p>
      </article>
      <article class="spec">
        <h2>SPEC</h2>
        <p>造形サイズ: 120mm角<br>対応素材: PLA, PETG<br>接続: USB, Wi-Fi<br>保証: 1年間</p>
      </article>
      <aside>
        <h2>ページ情報</h2>
        <p><strong>対象者:</strong> 学校の情報担当教員、地域工房、試作担当者</p>
        <p><strong>製作者:</strong> サクラツールズ株式会社 営業企画部</p>
        <p><strong>更新情報:</strong> 2026年3月15日、教育機関向け見積条件を追記</p>
      </aside>
    </div>
  </main>
</body>
</html>
