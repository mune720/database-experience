<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>長久手市 ごみ分別ミニガイド</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #1f2933;
      background: #eef6fb;
      line-height: 1.75;
    }
    header {
      background: #0b65a3;
      color: white;
      padding: 28px 8vw;
      border-bottom: 6px solid #8fd14f;
    }
    main {
      max-width: 880px;
      margin: 28px auto;
      padding: 0 20px 40px;
    }
    section {
      background: white;
      border: 1px solid #d7e4ee;
      padding: 22px;
      margin-bottom: 18px;
    }
    h1, h2 {
      margin: 0 0 12px;
    }
    .notice {
      border-left: 5px solid #f7b733;
      background: #fff8e6;
    }
    dl {
      display: grid;
      grid-template-columns: 7em 1fr;
      gap: 8px 14px;
      margin: 0;
    }
    dt {
      font-weight: 700;
      color: #0b65a3;
    }
    dd {
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>長久手市 ごみ分別ミニガイド</h1>
    <p>家庭から出る資源とごみの出し方を、初めての一人暮らしでも確認しやすくまとめた案内ページです。</p>
  </header>
  <main>
    <section>
      <h2>主な内容</h2>
      <p>燃えるごみ、プラスチック製容器包装、びん・缶、古紙の出し方を紹介します。収集日の朝8時までに、決められた集積所へ出してください。</p>
    </section>
    <section class="notice">
      <h2>分類のヒント</h2>
      <p>自治体の生活情報ですが、環境教育や地域活動にも関係します。検索エンジンでは「公的機関」「生活」「環境」などの分類候補が考えられます。</p>
    </section>
    <section>
      <h2>ページ情報</h2>
      <dl>
        <dt>対象者</dt>
        <dd>市内に住む学生、転入者、町内会のごみ当番</dd>
        <dt>製作者</dt>
        <dd>長久手市環境課 分別啓発チーム</dd>
        <dt>更新情報</dt>
        <dd>2026年4月1日、プラスチック回収日の説明を更新</dd>
      </dl>
    </section>
  </main>
</body>
</html>
