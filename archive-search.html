<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アーカイブ横断検索 — 図書館情報技術論</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="archive.css">
</head>
<body class="archive-page">
<header>
  <a class="home-link" href="index.html">トップへ戻る</a>
  <h1>🔎 アーカイブ横断検索</h1>
</header>

<main class="course-main archive-main">
  <div id="notice" class="archive-notice" hidden></div>

  <p class="search-lead small">すべての資料をまとめて検索できます。<a class="inline-link" href="archive.html">アーカイブ一覧へ →</a></p>

  <div class="cross-search">
    <input type="search" id="q" class="cross-search-input" placeholder="キーワードで検索（例：看板、祭り、〇〇商店街 など）" autocomplete="off" aria-label="横断検索キーワード">
  </div>

  <div id="mediaFilters" class="subject-filters" aria-label="メディア種別で絞り込み"></div>

  <p id="summary" class="search-summary" hidden></p>
  <div id="resultGrid" class="item-grid"></div>
  <p id="emptyState" class="empty-state" hidden></p>
  <p id="loading" class="spinner-note" hidden>読み込み中…</p>
</main>

<footer>
  <p>図書館情報技術論</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="archive-config.js"></script>
<script src="archive-search.js"></script>
</body>
</html>
